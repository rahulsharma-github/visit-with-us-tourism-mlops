name: Tourism Project Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'tourism_project/**'
      - 'tests/**'
      - '.github/workflows/pipeline.yml'
      - '!tourism_project/deployment/model.joblib'
      - '!tourism_project/deployment/model_metadata.json'
      - '!tourism_project/reports/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tourism-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '42'
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - run: python -m pip install -r tourism_project/requirements.txt
      - name: Validate and register repository CSV
        run: python -m tourism_project.model_building.data_register
      - uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: |
            tourism_project/data/tourism.csv
            tourism_project/reports/registration.json
          if-no-files-found: error

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - run: python -m pip install -r tourism_project/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project
      - name: Produce group-disjoint train and test artifacts
        run: python -m tourism_project.model_building.prep
      - uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/splits/
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - run: python -m pip install -r tourism_project/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/splits
      - name: Tune candidates, track every trial, evaluate and serialize
        run: python -m tourism_project.model_building.train
      - name: Verify model, artifact and Streamlit contracts
        run: python -m pytest tests -q --junitxml=tourism_project/reports/tests.xml
      - name: Retain MLflow experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-tracking
          path: tourism_project/mlruns/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            tourism_project/deployment/model.joblib
            tourism_project/deployment/model_metadata.json
            tourism_project/reports/
          if-no-files-found: error

  promote-model:
    needs: model-training
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: tourism_project
      - name: Commit validated model and reports to main
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo 'Newer source exists on main. Refusing to publish a stale model.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tourism_project/deployment/model.joblib tourism_project/deployment/model_metadata.json tourism_project/reports
          if git diff --cached --quiet; then
            echo 'Model artifacts already match main.'
          else
            git commit -m 'Promote validated tourism model [skip ci]'
            git push origin HEAD:main
          fi
          echo '### Validated model available on main' >> "$GITHUB_STEP_SUMMARY"
          echo 'Streamlit Community Cloud follows the committed application and model.' >> "$GITHUB_STEP_SUMMARY"
